[package]
name = "bullshism"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "A launcher full of apps you should not trust, starting with a calculator that is always wrong."
license = "MIT"
repository = "https://github.com/MysticYewXd/Bullshism"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[profile.release]
opt-level = 3
lto = true
strip = true
